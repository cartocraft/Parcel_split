<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastral Parcel Map - Triyuga</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-100 flex flex-col md:flex-row h-screen">

    <!-- Sidebar / Control Panel -->
    <div class="w-full md:w-1/3 lg:w-1/4 bg-white shadow-lg flex flex-col p-4 z-10 overflow-y-auto">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800 border-b-2 border-blue-600 pb-2">Parcel Query</h1>
            <p class="text-sm text-gray-500 mt-1">Search cadastral database</p>
        </div>

        <!-- Cascading Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">VDC (rem)</label>
                <select id="vdc-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border bg-gray-50" disabled>
                    <option value="">Loading...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Ward No.</label>
                <select id="ward-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border bg-gray-50" disabled>
                    <option value="">Select VDC first</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Sheet No. (wd)</label>
                <select id="sheet-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border bg-gray-50" disabled>
                    <option value="">Select Ward first</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Parcel No.</label>
                <select id="parcel-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border bg-gray-50" disabled>
                    <option value="">Select Sheet first</option>
                </select>
            </div>

            <button id="search-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-150" disabled>
                Display Parcel
            </button>
            
            <!-- Error Message Display -->
            <div id="error-message" class="hidden text-red-600 text-sm font-medium mt-2 bg-red-50 p-2 rounded border border-red-200"></div>
        </div>

        <!-- Results Display -->
        <div id="results-panel" class="hidden mt-6 border-t pt-4">
            <h2 class="text-lg font-semibold text-gray-800 mb-2">Parcel Details</h2>
            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 text-sm space-y-2">
                <p><span class="font-bold text-gray-700">Area:</span> <span id="res-area" class="text-blue-700 font-mono"></span></p>
                <p><span class="font-bold text-gray-700">Land Use:</span> <span id="res-lu"></span></p>
            </div>

            <!-- Map Tools -->
            <div class="mt-4 p-3 bg-gray-50 rounded border">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input type="checkbox" id="toggle-labels" class="form-checkbox h-5 w-5 text-blue-600 rounded">
                    <span class="text-gray-700 font-medium">Show Boundary Lengths</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div class="flex-1 relative">
        <div id="map"></div>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    
    <!-- Custom Application Logic -->
    <script src="app.js" defer></script>
</body>
</html>
